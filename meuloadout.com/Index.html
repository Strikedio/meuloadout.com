<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu PC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Meu PC</h1>
        <nav>
            <ul>
                <li><a href="#especificacoes">Especificações</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="especificacoes">
            <h2>Especificações do PC</h2>
            <form id="formEspecificacoes">
                <label for="processador">Processador:</label>
                <input type="text" id="processador" required>

                <label for="memoria">Memória RAM:</label>
                <input type="text" id="memoria" required>

                <label for="armazenamento">Armazenamento:</label>
                <input type="text" id="armazenamento" required>

                <button type="submit">Salvar Especificações</button>
            </form>
            <div id="resultado"></div>
        </section>

        <section id="sobre">
            <h2>Sobre</h2>
            <p>Este site permite que você registre as especificações do seu PC de forma simples e rápida.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Meu PC</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
